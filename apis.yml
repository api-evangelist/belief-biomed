aid: belief-biomed

name: Belief Biomed

description: Belief BioMed is a global biotechnology company focused on developing gene therapies for monogenic, degenerative, and malignant diseases.
  It integrates research, manufacturing, and clinical application of innovative AAV vector platforms, with pipelines in rare genetic diseases,
  chronic conditions, and commercial products. The company operates in China and the US, with IND clearances and FDA fast‑track designations for
  candidates such as BBM‑D101 and BBM‑P002.

